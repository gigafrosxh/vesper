name: Release

# Steht in package.json eine Version, zu der es noch kein Release gibt, baut dieser
# Workflow das Spiel für Windows, legt den Tag vX.Y.Z an und veröffentlicht ein
# GitHub Release mit den Notizen aus CHANGELOG.md. Auslöser: Push auf main, ein
# von Hand gepushter Tag vX.Y.Z oder ein manueller Start.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu package.json ($version)"
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version gibt es schon, nichts zu tun."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Release-Notizen aus CHANGELOG.md
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found && /^\[.*\]: / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::Kein Abschnitt [$VERSION] in CHANGELOG.md"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Windows-Build (Installer, portable .exe, ZIP)
        run: |
          npx vite build
          npx electron-builder --win nsis portable zip --x64 --publish never \
            -c.win.artifactName='VESPER-${version}-win-x64.${ext}'

      - name: Quellcode-ZIP
        run: git archive --format=zip --prefix="vesper-$VERSION/" -o "release/VESPER-$VERSION-source.zip" HEAD

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: VESPER ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ contains(env.VERSION, '-') }}
          files: |
            release/VESPER-Setup-*.exe
            release/VESPER-*-portable.exe
            release/VESPER-*-win-x64.zip
            release/VESPER-*-source.zip
